<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <title> Sign Up Page </title>
    </head>

    <body class="column">
        <h1> Sign Up Form</h1>
        <form id="signupForm" action="welcome.html">
            <label> First Name:
                <input type="text" id="fName" name="fName"><br>
            </label>

            <label>Last Name:
                <input type="text" id="lName" name="lName"><br>
            </label>

            Gender:
            <label><input type="radio" name="gender" value="m"> Male</label>
            <label><input type="radio" name="gender" value="f"> Female</label><br>

            <label>Zip Code:
                <input type="text" id="zip" name="zip"><br>
            </label>

            City: <span id="city"></span><br>
            Latitude: <span id="latitude"></span><br>
            Longitude: <span id="longitude"></span><br>

            <label>State:
                <select id="state" name="state">
                    <option value="">Loading States...</option>
                </select><br>
            </label>

            <label>Select a County:
                <select id="county" name="county"></select><br>
            </label>

            <label>Desired Username:
                <input type="text" id="username" name="username">
            </label>
            <span id="usernameError"></span><br>

            <label>Password:
                <input type="password" id="password" name="password">
            </label>
            <span id="suggestedPass"></span><br>

            <label>Type Password Again:
                <input type="password" id="passwordAgain" name="passwordAgain">
            </label>
            <span id="passwordError"></span><br>
            <span id="passwordError2"></span><br>

            <button class="submitBtn">Sign up!</button>
        </form>

        <script src="js/script.js"></script>

        <footer>
            <p>&copy; 2026 Ethan Shelley. All rights reserved.</p>
            <p>This site is for academic purposes only.</p>
            <p>CST 336 Internet Programming.</p>
            <img src="img/CSUMB-Logo.jpg" alt="CSUMB Logo">
        </footer>
    </body>
</html>
